name: Release Plugin

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Package and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"

      - name: Validate version tag
        run: |
          PLUGIN_VERSION="$(grep -E '^[[:space:]]*\* Version:' weekly-wildcat-headless.php | head -n 1 | sed -E 's/.*Version:[[:space:]]*//')"
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          if [ -z "$PLUGIN_VERSION" ]; then
            echo "Could not find plugin Version header."
            exit 1
          fi

          if [ "$PLUGIN_VERSION" != "$TAG_VERSION" ]; then
            echo "Plugin version ($PLUGIN_VERSION) does not match tag ($GITHUB_REF_NAME)."
            exit 1
          fi

          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$PLUGIN_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Plugin version ($PLUGIN_VERSION) does not match package version ($PACKAGE_VERSION)."
            exit 1
          fi

          echo "PLUGIN_VERSION=$PLUGIN_VERSION" >> "$GITHUB_ENV"

      - name: Install admin dependencies
        run: npm ci

      - name: Test and build admin assets
        run: |
          npm test
          npm run typecheck
          npm run build
          test -f build/index.js
          test -f build/index.asset.php
          test -f build/index.css
          test -f build/style-index.css

      - name: Test Discord service
        working-directory: discord-bot
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build

      - name: Test PHP
        run: |
          find . -type f -name '*.php' \
            -not -path './node_modules/*' \
            -not -path './discord-bot/node_modules/*' \
            -print0 | xargs -0 -n1 php -l
          for test_file in tests/*.php; do php "$test_file"; done

      - name: Build plugin zip
        run: |
          rm -rf release weekly-wildcat-headless.zip
          mkdir -p release/weekly-wildcat-headless

          rsync -a ./ release/weekly-wildcat-headless/ \
            --exclude '.git' \
            --exclude '.gitignore' \
            --exclude '.github' \
            --exclude 'discord-bot' \
            --exclude 'node_modules' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'tests' \
            --exclude 'tests-js' \
            --exclude 'src' \
            --exclude 'scripts' \
            --exclude 'README.md' \
            --exclude 'package.json' \
            --exclude 'package-lock.json' \
            --exclude 'tsconfig.json' \
            --exclude 'vitest.config.mts' \
            --exclude 'release' \
            --exclude '*.zip' \
            --exclude '*.map' \
            --exclude '.DS_Store'

          cd release
          zip -qr weekly-wildcat-headless.zip weekly-wildcat-headless
          unzip -l weekly-wildcat-headless.zip | grep 'weekly-wildcat-headless/weekly-wildcat-headless.php'
          unzip -l weekly-wildcat-headless.zip | grep 'weekly-wildcat-headless/build/index.js'
          unzip -l weekly-wildcat-headless.zip | grep 'weekly-wildcat-headless/build/index.asset.php'
          unzip -l weekly-wildcat-headless.zip | grep 'weekly-wildcat-headless/build/index.css'
          unzip -l weekly-wildcat-headless.zip | grep 'weekly-wildcat-headless/build/style-index.css'
          if unzip -l weekly-wildcat-headless.zip | grep -q 'weekly-wildcat-headless/discord-bot/'; then
            echo "Discord bot must not be included in the WordPress plugin archive."
            exit 1
          fi
          if unzip -l weekly-wildcat-headless.zip | grep -q '/node_modules/'; then
            echo "node_modules must not be included in the WordPress plugin archive."
            exit 1
          fi
          if unzip -l weekly-wildcat-headless.zip | grep -Eq '/(src|tests|tests-js)/'; then
            echo "Development source and tests must not be included in the WordPress plugin archive."
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "release/weekly-wildcat-headless.zip#weekly-wildcat-headless.zip" \
            --title "$GITHUB_REF_NAME" \
            --notes "Byline $PLUGIN_VERSION"
