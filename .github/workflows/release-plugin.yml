name: Release WordPress Plugin

on:
  push:
    tags:
      - "v*"
  # The automatic release workflow calls this one directly: tags pushed with the
  # repository token do not start other workflows. The tag is created here, at
  # the end, so a release that fails validation leaves no tag behind.
  workflow_call:
    inputs:
      tag:
        description: Release tag to publish, for example v0.3.2.
        required: true
        type: string
      sha:
        description: Commit the tag is created on.
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  RELEASE_SHA: ${{ inputs.sha || github.sha }}

jobs:
  php-compatibility:
    name: Plugin PHP ${{ matrix.php }} compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.0", "8.3"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.ref }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: Lint and run plugin PHP regression suite
        run: npm run test:php

  release:
    name: Validate, package, and publish
    needs: php-compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2

      - name: Validate release version
        run: |
          PLUGIN_VERSION="$(grep -E '^[[:space:]]*\* Version:' wordpress-plugin/weekly-wildcat-headless.php | head -n 1 | sed -E 's/.*Version:[[:space:]]*//')"
          TAG_VERSION="${RELEASE_TAG#v}"
          PACKAGE_VERSION="$(node -p "require('./wordpress-plugin/package.json').version")"

          test -n "$PLUGIN_VERSION"
          test "$PLUGIN_VERSION" = "$TAG_VERSION"
          test "$PLUGIN_VERSION" = "$PACKAGE_VERSION"
          echo "PLUGIN_VERSION=$PLUGIN_VERSION" >> "$GITHUB_ENV"

      - name: Install workspace dependencies
        run: npm ci

      - name: Test and build admin assets
        run: |
          npm run test:plugin
          npm run typecheck:plugin
          npm run build:plugin

      - name: Test PHP compatibility
        run: npm run test:php

      - name: Verify updater transition
        run: node scripts/verify-updater-transition.mjs

      - name: Build and validate installable ZIP
        run: npm run package:plugin

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            "wordpress-plugin/release/weekly-wildcat-headless.zip#weekly-wildcat-headless.zip" \
            --target "$RELEASE_SHA" \
            --title "$RELEASE_TAG" \
            --notes "Byline WordPress plugin $PLUGIN_VERSION"
