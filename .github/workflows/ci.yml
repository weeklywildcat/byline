name: Monorepo CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cloudflare-scoped-build:
    name: Cloudflare scoped install and Astro build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Simulate a restored Astro cache
        run: |
          mkdir -p apps/web/node_modules/.astro
          echo retained > apps/web/node_modules/.astro/cloudflare-cache-sentinel

      - name: Install public-site dependencies and build
        env:
          BYLINE_PUBLICATION_FILE: tests/fixtures/weekly-wildcat-publication.json
          BYLINE_CONTENT_MODE: weekly-wildcat-fixture
        run: npm run build:cloudflare

      - name: Verify cache retention, workspace links and static export
        run: |
          test "$(cat apps/web/node_modules/.astro/cloudflare-cache-sentinel)" = retained
          test -d node_modules/@byline/content
          # The private newsroom (Payload) never enters the public build.
          test ! -d node_modules/payload
          test -s apps/web/out/_byline/manifest.json

  newsroom:
    name: Newsroom (Payload + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: byline
          POSTGRES_PASSWORD: byline
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U byline"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Validate production newsroom Dockerfile
        run: docker build --check -f apps/newsroom/Dockerfile .

      - name: Build production newsroom image
        run: docker build -f apps/newsroom/Dockerfile -t byline-newsroom:ci .

      - name: Install workspace dependencies
        run: npm ci

      - name: Typecheck and unit-test the newsroom
        run: npm run typecheck:newsroom && npm run test:newsroom

      - name: Access-control and storage integration tests against PostgreSQL
        env:
          BYLINE_TEST_DATABASE_URL: postgres://byline:byline@localhost:5432/byline_newsroom_test
        run: npm run test:newsroom:integration

      - name: Committed migrations apply to an empty database and match the config
        env:
          DATABASE_URL: postgres://byline:byline@localhost:5432/byline_newsroom_migrations
          PAYLOAD_SECRET: ci-migration-check-secret-0123456789abcdef
        run: |
          PGPASSWORD=byline psql -h localhost -U byline -d postgres -c "CREATE DATABASE byline_newsroom_migrations"
          npm run migrate:check --workspace @byline/newsroom

      - name: Install Chromium for Payload snapshot parity
        run: npx playwright install --with-deps chromium

      - name: Verify Payload snapshot acquisition, media, and static export
        env:
          DATABASE_URL: postgres://byline:byline@localhost:5432/byline_newsroom_migrations
          PAYLOAD_SECRET: ci-snapshot-parity-secret-0123456789abcdef
          BYLINE_DB_PUSH: "0"
          BYLINE_MEDIA_LOCAL_DIR: ${{ runner.temp }}/parity-originals
          BYLINE_PUBLICATION_MEDIA_DIR: ${{ runner.temp }}/parity-publication
        run: npm run payload --workspace @byline/newsroom -- run scripts/payload-snapshot-parity.ts "${{ runner.temp }}/parity"

  validate:
    name: Shared contracts and public site
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Typecheck public and shared packages
        run: npm run typecheck:packages && npm run typecheck:frontend

      - name: Test public and shared packages
        run: npm run test:packages && npm run test:frontend

      - name: Build and verify Weekly Wildcat Astro static export
        env:
          BYLINE_PUBLICATION_FILE: tests/fixtures/weekly-wildcat-publication.json
          BYLINE_CONTENT_MODE: weekly-wildcat-browser-fixture
          BYLINE_BUILD_TOKEN: BYLINE_TEST_SECRET_DO_NOT_EXPORT
          BYLINE_DEPLOY_HOOK_URL: BYLINE_TEST_SECRET_DO_NOT_EXPORT
        run: npm run build:frontend

      - name: Install Chromium for public Astro browser tests
        run: npx playwright install --with-deps chromium

      - name: Run public Astro browser tests
        env:
          BYLINE_PUBLICATION_FILE: tests/fixtures/weekly-wildcat-publication.json
          BYLINE_CONTENT_MODE: weekly-wildcat-browser-fixture
        run: npm run test:frontend:browser

      - name: Verify public and shared contracts
        run: npm run verify:contracts
