# Local PostgreSQL for the Byline newsroom. Development only; credentials here are not secrets.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: byline
      POSTGRES_PASSWORD: byline
      POSTGRES_DB: byline_newsroom
    ports:
      - "54329:5432"
    volumes:
      - byline-newsroom-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U byline -d byline_newsroom"]
      interval: 5s
      retries: 10
volumes:
  byline-newsroom-pg:
