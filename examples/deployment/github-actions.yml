name: Deploy Byline static site

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [byline-publish]

concurrency:
  group: byline-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Byline static export
        env:
          NEXT_PUBLIC_WP_API_URL: ${{ vars.BYLINE_WP_API_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.BYLINE_SITE_URL }}
          BYLINE_PUBLICATION_URL: ${{ vars.BYLINE_PUBLICATION_URL }}
          WORDPRESS_FETCH_CACHE_KEY: ${{ github.sha }}
        run: npm run build:frontend

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static export
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
